name: Bug Report
description: Report a problem with a reusable workflow
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: input
    id: workflow
    attributes:
      label: Workflow and version
      placeholder: e.g. container-image.yml@v1.0.0
    validations:
      required: true

  - type: input
    id: run
    attributes:
      label: Link to the failing run
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
